<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>📰 Fake News Detection</h1>

    <form method="POST">

        <textarea
            name="news"
            rows="12"
            placeholder="Enter the news article here..."
            required></textarea>

        <br><br>

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}
    <div class="result">
        <h2>{{ prediction }}</h2>
    </div>
    {% endif %}

</div>

</body>
</html>
